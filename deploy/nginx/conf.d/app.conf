# Единственная точка входа: наружу открыт только порт 80 (через compose он
# пробрасывается как 8080). Приложение, база и мониторинг живут во внутренней
# сети и напрямую недоступны.

upstream api {
    server app:3000;
    keepalive 32;
}

# Метрики и health-check отдаёт сам балансировщик: приложение их специально
# монтирует вне /api, где общий rate limit не действует.
server {
    listen 80 default_server;
    server_name _;

    # Диагностика самого прокси. Причину отказа приложения покажет app-лог.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Метрики наружу не отдаём: иначе любой желающий увидит пути, статусы и
    # внутренние идентификаторы. Для сбора есть Prometheus из своей сети.
    location = /metrics {
        return 404;
    }

    # Стартовая страница: без неё корень уходил бы в приложение и давал 404.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://api;

        # X-Request-Id отдаём клиенту всегда, даже если приложение его не
        # прислало: по нему пользователь присылает request id в поддержку.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Тело запроса ограничиваем здесь же: BODY_LIMIT в приложении не
        # спасает, если тело уже принято прокси.
        client_max_body_size 1m;
        client_body_buffer_size 64k;
        client_body_timeout 30s;

        # Медленный клиент не должен держать соединение с бэкендом.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Ответ приложения маленький, буферизовать его незачем: так быстрее
        # отдаётся первой строке JSON.
        proxy_buffering off;

        # Keep-alive к бэкенду израсходует соединение надолго: при рестарте
        # приложения nginx будет ждать до proxy_read_timeout вместо
        # мгновенного переключения на новый контейнер.
        proxy_set_header Connection "";

        # Заголовки ответа не переписываем: приложение само ставит Helmet
        # (HSTS, CSP, nosniff), а дублирование портит заголовки.
        proxy_hide_header Server;
    }
}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CaseLab · Request Tracking</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #16181d;
        --muted: #5b6472;
        --bg: #f6f7f9;
        --card: #ffffff;
        --line: #e2e6ec;
        --accent: #2f5fd0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e8eaed;
          --muted: #9aa3b2;
          --bg: #14161a;
          --card: #1c1f24;
          --line: #2a2f36;
          --accent: #7aa2f7;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      main {
        width: 100%;
        max-width: 640px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 32px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 24px;
        letter-spacing: -0.01em;
      }
      p.sub {
        margin: 0 0 24px;
        color: var(--muted);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      a {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--fg);
        text-decoration: none;
      }
      a:hover {
        border-color: var(--accent);
      }
      a span {
        color: var(--muted);
        font-size: 14px;
      }
      footer {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CaseLab · Request Tracking</h1>
      <p class="sub">Сервис учёта заявок на ремонт оборудования.</p>
      <ul>
        <li><a href="/api/docs">Swagger UI <span>интерактивный API</span></a></li>
        <li><a href="/api/docs/openapi.json">OpenAPI 3.1 <span>спецификация</span></a></li>
        <li><a href="/api/health/live">Живость <span>/api/health/live</span></a></li>
        <li><a href="/api/health/ready">Готовность <span>/api/health/ready</span></a></li>
      </ul>
      <footer>
        Метрики Prometheus (<code>/metrics</code>) наружу не публикуются: их
        забирает мониторинг из внутренней сети.
      </footer>
    </main>
  </body>
</html>
